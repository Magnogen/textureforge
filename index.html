<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Texture Forge | Magnogen</title>

  <script src="https://src.magnogen.net/dom.js"></script>

  <script type="module" src="./sketch.js"></script>
</head>
<body>
  <div class="canvas">
    <h1 class="title">Texture Forge</h1>
    <canvas id="canvas"></canvas>
  </div>
  <div class="palette">
    <input type="range" min="0" max="0.9" step="0.01" value="0.5" id="chroma">
    <canvas id="palette"></canvas>
    <div id="picker"></div>
  </div>
  <a
    class="github-banner"
    href="https://github.com/Magnogen/textureforge"
    target="_blank"
  >
    View on GitHub
  </a>
</body>
</html>
